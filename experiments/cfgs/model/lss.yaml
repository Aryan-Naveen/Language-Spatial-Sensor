# LSSConfig hyperparameters.
# All fields map directly to language_spatial_sensor.models.config.LSSConfig.

# ── Dimensions ────────────────────────────────────────────────────────────────
hidden_dim: 256
clip_dim: 512
bert_dim: 768

# ── Text encoder ──────────────────────────────────────────────────────────────
text_model: bert-base-uncased
freeze_text: true        # fine-tune BERT; set true to freeze for faster runs

# ── Spatial relation MLP ──────────────────────────────────────────────────────
# spatial_relation_dim must match pairwise_rel_type:
#   mlp → 12  |  center/vertical_bottom → 1, 4, or 5  |  topological/geometric_algebra → 7
spatial_relation_dim: 12
spatial_mlp_hidden: 64
pairwise_rel_type: mlp         # mlp | center | vertical_bottom | topological | geometric_algebra
spatial_pairwise_dist_norm: true   # unused for mlp / topological / geometric_algebra
# Condition the spatial-MLP hidden layer on text CLS so the bias depends on the
# query (e.g. "above" can up-weight vertical pairs).
condition_spatial_on_text: true
spatial_conditioning_type: film    # film | gate | film_gate

# ── Anchor-centric coordinates ────────────────────────────────────────────────
# Add an additive (centre − anchor-centroid) embedding to each object feature.
use_anchor_centric_coords: true

# ── Backbone ──────────────────────────────────────────────────────────────────
backbone_type: scene_spatial
num_spatial_layers: 3

# ── Global fusion transformer ─────────────────────────────────────────────────
num_fusion_layers: 3
num_heads: 8
ffn_dim: 1024
# Ablation switch: skip the GlobalFusionTransformer; pool object features alone
# and add the text CLS to the pooled vector. Incompatible with pooling_type=query_token.
use_global_fusion: true

# Ablation switch: zero out obj_bboxes before computing pairwise spatial features
# and anchor-centric offsets. Symmetric counterpart to a "no language" ablation.
zero_bboxes: false

# ── Pooling ───────────────────────────────────────────────────────────────────
# mean | max | attention | query_token
# query_token: DETR-style target query prepended to the fusion sequence; its
# post-fusion state is the context vector (no scene averaging).
pooling_type: query_token

# ── Output head ───────────────────────────────────────────────────────────────
# gaussian_cholesky | gaussian_diagonal
head_type: gaussian_cholesky
head_hidden_sizes: [1024, 512]
head_dropout: 0.15
# σ floor in region-normalised frame (region ≈ 1.0 per axis).
# 0.05 ≈ 5% of region size — prevents variance collapse and caps the
# NLL right-tail on confident-but-wrong samples. Raise for tighter IQR.
head_min_sigma: 0.05

# ── FiLM conditioning ─────────────────────────────────────────────────────────
use_film: true
film_hidden_dim: 64

# ── Regularisation ────────────────────────────────────────────────────────────
dropout: 0.3

# ── Sequence limits ───────────────────────────────────────────────────────────
max_objects: 150
max_text_len: 64
