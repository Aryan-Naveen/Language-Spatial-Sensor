defaults:
  - data: vla3d
  - model: lss
  - _self_

# ── Training hyperparameters ──────────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 256
  # Learning rate — BERT params use lr * bert_lr_scale
  lr: 1.0e-4
  bert_lr_scale: 0.1
  weight_decay: 1.0e-2
  warmup_steps: 500
  grad_clip: 1.0
  # Mixed precision: "bf16" | "fp16" | "fp32"
  # bf16 enables flash attention in TransformerEncoderLayer + BERT SDPA
  precision: bf16
  num_workers: 4
  seed: 42
  # Validate every N epochs
  val_every: 1
  # bbox_cdf_loss (language_spatial_sensor.models.components.heads)
  bbox_cdf_lambda_dist: 0.1
  bbox_cdf_eps: 1.0e-8

# ── Cache ─────────────────────────────────────────────────────────────────────
cache:
  # Built by scripts/preprocess.py; relative to the lss/ root or absolute.
  dir: cache
  force_rebuild: false
  num_workers: 4  # parallel scene workers in preprocess.py
  # SpatialQueries tensorized per chunk inside each scene (same thread).
  tensorize_batch_size: 64

# ── Augmentations (applied to train split only) ───────────────────────────────
augmentation:
  # (a) probability of masking each non-anchor object
  mask_prob: 0.01
  # (b) random Z-axis rotation — max angle in degrees
  rotate: false
  # (c) Gaussian jitter on object centres (region-normalised units)
  jitter_std: 0.02

# ── Weights & Biases logging ──────────────────────────────────────────────────
wandb:
  project: langmap-lss
  entity: null          # your W&B username / team; null = default
  name: null            # run name; null = auto-generated by W&B
  tags: []
  # Set to false to disable W&B (useful for quick debugging)
  enabled: true

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dir: checkpoints
  # Save a checkpoint every N epochs (in addition to best-val checkpoint)
  save_every: 5

# ── BEV visualisation ─────────────────────────────────────────────────────────
viz:
  # Number of validation scenes to render per split
  n_scenes: 5
  # Number of position samples drawn from the predicted distribution per scene.
  # The rendering interface accepts raw samples so it generalises to a diffusion
  # transformer sampler without any code changes.
  n_samples: 5000
  # Fixed RNG seed — guarantees the same scenes are visualised every run
  seed: 0
  # Generate BEV plots every N validation epochs (val_every already gates evals)
  plot_every: 5

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
