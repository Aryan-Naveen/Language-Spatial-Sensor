defaults:
  - data: vla3d
  - model: lss
  - _self_

# ── Training hyperparameters ──────────────────────────────────────────────────
training:
  epochs: 25
  batch_size: 256
  # Learning rate — BERT params use lr * bert_lr_scale
  lr: 1.0e-4
  bert_lr_scale: 0.0
  weight_decay: 1.0e-2
  warmup_steps: 500
  grad_clip: 1.0
  # Mixed precision: "bf16" | "fp16" | "fp32"
  # bf16 enables flash attention in TransformerEncoderLayer + BERT SDPA
  precision: bf16
  num_workers: 4
  seed: 42
  # Validate every N epochs
  val_every: 1
  # Loss function: "bbox_cdf" | "center_nll"
  loss_type: center_nll
  # bbox_cdf_loss hyperparameters (used when loss_type: bbox_cdf)
  bbox_cdf_lambda_dist: 0.1
  bbox_cdf_eps: 1.0e-8
  # center_nll_loss hyperparameters (used when loss_type: center_nll)
  center_nll_lambda_l1: 1.0
  # Mahalanobis (sqrt-quad) penalty: pulls down the right-tail of quad by
  # pushing Σ wider where the mean is off — directly tightens NLL IQR.
  center_nll_lambda_mahal: 0.1
  # log|Σ| penalty: POSITIVE values pressure Σ *tighter*, which widens the
  # NLL tail on bad-confident samples.  Zero lets the NLL term alone balance
  # Σ against the data (standard MLE).  Keep small-or-zero for tight IQR.
  center_nll_lambda_vol: 0.0
  # Conformal prediction metrics (validation only)
  conformal_superset: false
  conformal_coverage: 0.9

# ── Cache ─────────────────────────────────────────────────────────────────────
cache:
  # Built by scripts/preprocess.py; relative to the lss/ root or absolute.
  dir: cache
  force_rebuild: false
  num_workers: 4  # parallel scene workers in preprocess.py
  # SpatialQueries tensorized per chunk inside each scene (same thread).
  tensorize_batch_size: 64

# ── Augmentations (applied to train split only) ───────────────────────────────
augmentation:
  # (a) Drop-object: hide non-anchor objects so the model can't memorise specific
  #     object-to-object pairs and must rely on remaining spatial context.
  mask_prob: 0.3
  # (b) Full Z-axis symmetry: train on all yaw rotations so the model learns
  #     relative geometry rather than absolute region coordinates.
  rotate: false
  rotate_max_deg: 180.0
  # (c) Gaussian jitter on object centres (region-normalised units).
  jitter_std: 0.05

# ── Weights & Biases logging ──────────────────────────────────────────────────
wandb:
  project: langmap-lss
  entity: null          # your W&B username / team; null = default
  name: null            # run name; null = auto-generated by W&B
  tags: []
  # Set to false to disable W&B (useful for quick debugging)
  enabled: true

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint:
  dir: checkpoints
  # Save a checkpoint every N epochs (in addition to best-val checkpoint)
  save_every: 5

# ── BEV visualisation ─────────────────────────────────────────────────────────
viz:
  # Number of validation scenes to render per split
  n_scenes: 5
  # Number of position samples drawn from the predicted distribution per scene.
  # The rendering interface accepts raw samples so it generalises to a diffusion
  # transformer sampler without any code changes.
  n_samples: 5000
  # Fixed RNG seed — guarantees the same scenes are visualised every run
  seed: 0
  # Generate BEV plots every N validation epochs (val_every already gates evals)
  plot_every: 5

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  # Uncomment + install hydra-optuna-sweeper to enable Optuna HPO:
